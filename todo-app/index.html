<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | JavaScript To-Do & State Manager</title>
  <meta name="description" content="Interactive client-side To-Do List application with full CRUD operations, filtering, and localStorage persistence.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container" aria-labelledby="app-title">
    <header class="app-header">
      <div>
        <h1 id="app-title">TaskFlow</h1>
        <p class="subtitle">State-driven task manager powered by LocalStorage</p>
      </div>
      <span class="task-counter" id="task-counter" aria-live="polite">0 tasks left</span>
    </header>

    <!-- Create Task Form -->
    <form id="task-form" class="task-form" aria-label="Add a new task">
      <label for="task-input" class="sr-only">New task description</label>
      <input
        type="text"
        id="task-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        required>
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <!-- Filter Controls (Event Delegation Container) -->
    <div class="controls-bar">
      <div class="filter-group" role="group" aria-label="Filter tasks" id="filter-buttons">
        <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button type="button" id="clear-completed" class="btn-link">Clear Completed</button>
    </div>

    <!-- Dynamic Task List (Event Delegation Target) -->
    <ul id="task-list" class="task-list" aria-label="Task list"></ul>

    <p id="empty-state" class="empty-state" hidden>No tasks match this view. Add one above!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
